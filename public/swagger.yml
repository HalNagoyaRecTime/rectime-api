openapi: 3.0.3
info:
  title: RecTime API
  description: |
    RecTime のバックエンドAPIです。
    イベントの書き込みAPIは、現時点では公開していません。
  version: 1.0.0

servers:
  - url: /api/v1
    description: APIのベースパス

paths:
  /students:
    get:
      tags: [Students]
      summary: 学生一覧をページ単位で取得する
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 学生一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Students]
      summary: 学生を登録する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentWriteRequest'
      responses:
        '201':
          description: 登録した学生
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /students/{studentId}:
    get:
      tags: [Students]
      summary: 学生を取得する
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: 学生
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Students]
      summary: 学生を更新する
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentWriteRequest'
      responses:
        '200':
          description: 更新後の学生
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /events:
    get:
      tags: [Events]
      summary: イベント一覧を取得する
      parameters:
        - name: start_time
          in: query
          description: JSTの開始時刻（HHMM形式）で完全一致検索する
          schema:
            type: string
            pattern: '^\\d{4}$'
            example: '0930'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: イベント一覧
          content:
            application/json:
              schema:
                type: object
                required: [events, total, limit, offset]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{eventId}:
    get:
      tags: [Events]
      summary: イベントを取得する
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: イベント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /classrooms:
    get:
      tags: [ClassRooms]
      summary: クラス一覧を取得する
      responses:
        '200':
          description: クラス一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassRoom'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gathering-spots:
    get:
      tags: [Gathering spots]
      summary: 集合場所一覧を取得する
      responses:
        '200':
          description: 集合場所一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GatheringSpot'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Gathering spots]
      summary: 集合場所を作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGatheringSpotRequest'
      responses:
        '201':
          description: 作成した集合場所
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatheringSpot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gathering-groups:
    get:
      tags: [Gathering groups]
      summary: 対象グループ一覧を取得する
      responses:
        '200':
          description: 対象グループ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GatheringGroup'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Gathering groups]
      summary: 対象グループを作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGatheringGroupRequest'
      responses:
        '201':
          description: 作成した対象グループ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatheringGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gathering-groups/{gatheringGroupId}/members:
    get:
      tags: [Gathering group members]
      summary: 対象グループの所属者一覧を取得する
      parameters:
        - $ref: '#/components/parameters/GatheringGroupId'
      responses:
        '200':
          description: 所属者一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GatheringGroupMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Gathering group members]
      summary: 対象グループへ所属者を追加する
      parameters:
        - $ref: '#/components/parameters/GatheringGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGatheringGroupMemberRequest'
      responses:
        '201':
          description: 追加した所属情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatheringGroupMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: すでに対象グループへ所属している
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gathering-groups/{gatheringGroupId}/members/{userId}:
    delete:
      tags: [Gathering group members]
      summary: 対象グループから所属者を削除する
      parameters:
        - $ref: '#/components/parameters/GatheringGroupId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: 削除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gatherings:
    get:
      tags: [Gatherings]
      summary: 集合予定一覧を取得する
      responses:
        '200':
          description: 集合予定一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gathering'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Gatherings]
      summary: 集合予定を作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGatheringRequest'
      responses:
        '201':
          description: 作成した集合予定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gathering'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 対象グループにはすでに集合予定が登録されている
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /firebase-tokens:
    post:
      tags: [Firebase tokens]
      summary: Firebaseトークンを登録または更新する
      description: 学籍番号で学生を特定し、Firebaseトークンを登録または更新します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterFirebaseTokenRequest'
      responses:
        '200':
          description: 登録または更新したFirebaseトークン
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterFirebaseTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notification-schedules:
    get:
      tags: [Notification schedules]
      summary: 通知予定一覧を取得する
      parameters:
        - name: sendStatus
          in: query
          schema:
            type: string
            enum: [draft, sending, sent, failed]
        - name: eventId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: gatheringGroupId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 通知予定一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationScheduleListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Notification schedules]
      summary: 通知予定を作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationScheduleRequest'
      responses:
        '201':
          description: 作成した通知予定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notification-schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Notification schedules]
      summary: 通知予定詳細を取得する
      responses:
        '200':
          description: 通知予定詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Notification schedules]
      summary: draftの通知予定を削除する
      responses:
        '204':
          description: 削除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications:
    get:
      tags: [Notifications]
      summary: 通知内容一覧を取得する
      parameters:
        - name: notificationType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 通知内容一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Notifications]
      summary: 通知内容を作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'
      responses:
        '201':
          description: 作成した通知内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Notifications]
      summary: 通知内容詳細を取得する
      responses:
        '200':
          description: 通知内容詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Notifications]
      summary: 通知内容を更新する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationRequest'
      responses:
        '200':
          description: 更新した通知内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/test:
    post:
      tags: [Notifications]
      summary: テスト用Firebase通知を送信する
      description: 環境変数 `TEST_FCM_TOKEN` に設定された端末へ通知を送信します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestNotificationRequest'
      responses:
        '200':
          description: 送信成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FcmNotificationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/microsoft/login:
    get:
      tags: [Auth]
      summary: Microsoftログイン認可URLを取得・リダイレクトする
      description: |
        Webクライアントの場合はMicrosoftの認可画面へ302リダイレクトします（PKCEはサーバー側で管理）。
        Mobileクライアントの場合は認可URLをJSONで返します（PKCEはクライアント側で管理し、
        `X-State` / `X-PKCE-Code-Challenge` ヘッダーの指定が必須）。
      parameters:
        - $ref: '#/components/parameters/ClientType'
        - name: X-State
          in: header
          description: Mobileクライアントのみ必須。PKCEのstate（Base64URL、デコード後32バイト以上）
          schema:
            type: string
        - name: X-PKCE-Code-Challenge
          in: header
          description: Mobileクライアントのみ必須。PKCEのcode_challenge（Base64URL）
          schema:
            type: string
      responses:
        '200':
          description: Mobileクライアント向けの認可URL
          content:
            application/json:
              schema:
                type: object
                required: [auth_url]
                properties:
                  auth_url:
                    type: string
        '302':
          description: Webクライアント向け、Microsoftの認可画面へのリダイレクト
        '400':
          $ref: '#/components/responses/AuthBadRequest'

  /auth/microsoft/callback:
    get:
      tags: [Auth]
      summary: Microsoftからの認可コールバックを処理する
      description: |
        Microsoftからのリダイレクトで呼び出され、トークン交換は行わずに
        `code` / `state` をそのまま `FRONTEND_URL/auth/callback` へ中継します。
        フロントエンドはそこから `POST /auth/microsoft/token`（`client_type: web`）を
        呼び出して自らトークン交換を行います。
        失敗時は `FRONTEND_URL/login?error=auth_failed` へリダイレクトします。
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '302':
          description: 成功時は `FRONTEND_URL/auth/callback?code=...&state=...` へ、失敗時はログイン画面へリダイレクト

  /auth/microsoft/token:
    post:
      tags: [Auth]
      summary: 認可コードをrectime-apiのアクセストークンと交換する
      description: |
        Mobile/Web共通のエンドポイントです（`X-Client-Type` で切り替え）。
        - mobile: `code_verifier` はクライアントが生成し、ボディで送信します。
        - web: `code_verifier` は `/auth/microsoft/login` 時にサーバー側で生成・
          保存済みのものを使うため、ボディでは `code` / `state` のみを送信します。
      parameters:
        - $ref: '#/components/parameters/ClientType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
      responses:
        '200':
          description: アクセストークン(refresh_token_idも併せて返却)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: ログイン中のユーザー情報を取得する
      description: 'Mobile/Webいずれも `Authorization: Bearer` で認証します。Cookieは使用しません。'
      parameters:
        - $ref: '#/components/parameters/ClientType'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ログイン中のユーザー情報
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /auth/me/photo:
    get:
      tags: [Auth]
      summary: ログイン中のユーザーのMicrosoftアカウント写真を取得する
      description: Microsoft Graph からユーザーの写真を取得して返却します。
      parameters:
        - $ref: '#/components/parameters/ClientType'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 写真データ
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          description: Microsoftアカウントに写真が登録されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: ログアウトする
      description: >-
        Mobile/Web共通。Bearerトークンで認証したうえで、`refresh_token_id`が
        保持するMicrosoftリフレッシュトークンのKVエントリを破棄します。
      parameters:
        - $ref: '#/components/parameters/ClientType'
      security:
        - bearerAuth: []
      requestBody:
        required: false
        description: '`refresh_token_id` を指定可能'
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token_id:
                  type: string
      responses:
        '200':
          description: ログアウト成功
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: アクセストークンを更新する
      description: >-
        Mobile/Web共通。`refresh_token_id` を用いてrectime-apiのアクセス
        トークンを再発行します。`refresh_token_id` は使用の都度ローテーション
        されます。
      parameters:
        - $ref: '#/components/parameters/ClientType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token_id]
              properties:
                refresh_token_id:
                  type: string
      responses:
        '200':
          description: 新しいアクセストークン・refresh_token_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

components:
  parameters:
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    GatheringGroupId:
      name: gatheringGroupId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ClientType:
      name: X-Client-Type
      in: header
      description: クライアント種別（省略時は `web` 扱い）
      schema:
        type: string
        enum: [web, mobile]

  responses:
    BadRequest:
      description: リクエストが不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 対象リソースが存在しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: リソースの現在状態では操作できない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: サーバーエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthBadRequest:
      description: リクエストが不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
    AuthUnauthorized:
      description: 認証が必要、またはセッション・トークンが無効
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Student:
      type: object
      required:
        [student_id, display_name, class_room_id, class_room_name, attendance_number, student_id_number, is_live_active]
      properties:
        student_id:
          type: integer
        display_name:
          type: string
        class_room_id:
          type: integer
        class_room_name:
          type: string
        attendance_number:
          type: integer
        student_id_number:
          type: string
        is_live_active:
          type: boolean

    StudentWriteRequest:
      type: object
      required: [display_name, class_room_id, attendance_number, student_id_number]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        class_room_id:
          type: integer
          minimum: 1
        attendance_number:
          type: integer
          minimum: 1
        student_id_number:
          type: string
          minLength: 1
          maxLength: 100

    StudentPage:
      type: object
      required: [students, total, limit, offset]
      properties:
        students:
          type: array
          items:
            $ref: '#/components/schemas/Student'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Event:
      type: object
      required: [event_id, event_name, venue, start_time, end_time, created_at, updated_at]
      properties:
        event_id:
          type: integer
        event_name:
          type: string
        rule_text:
          type: string
          nullable: true
        venue:
          type: string
        start_time:
          type: string
          description: JSTの時刻（HHMM形式）
          example: '0930'
        end_time:
          type: string
          description: JSTの時刻（HHMM形式）
          example: '1745'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClassRoom:
      type: object
      required: [class_room_id, class_code, class_name]
      properties:
        class_room_id:
          type: integer
        class_code:
          type: string
        class_name:
          type: string

    GatheringSpot:
      type: object
      required: [gathering_spot_id, gathering_spot_name, created_at, updated_at]
      properties:
        gathering_spot_id:
          type: integer
        gathering_spot_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateGatheringSpotRequest:
      type: object
      required: [gatheringSpotName]
      properties:
        gatheringSpotName:
          type: string
          minLength: 1

    GatheringGroup:
      type: object
      required: [gathering_group_id, gathering_group_name, created_at, updated_at]
      properties:
        gathering_group_id:
          type: integer
        gathering_group_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateGatheringGroupRequest:
      type: object
      required: [gatheringGroupName]
      properties:
        gatheringGroupName:
          type: string
          minLength: 1

    GatheringGroupMember:
      type: object
      required: [gathering_group_member_id, gathering_group_id, user_id, created_at, updated_at]
      properties:
        gathering_group_member_id:
          type: integer
        gathering_group_id:
          type: integer
        user_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AddGatheringGroupMemberRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer
          minimum: 1

    Gathering:
      type: object
      required:
        [gathering_id, gathering_group_id, event_id, gathering_spot_id, gathering_time, round, created_at, updated_at, gathering_group_name, event_name, gathering_spot_name]
      properties:
        gathering_id:
          type: integer
        gathering_group_id:
          type: integer
        event_id:
          type: integer
        gathering_spot_id:
          type: integer
        gathering_time:
          type: string
          description: HH:MM形式。`99:59`は集合時刻が未設定であることを表します。
          example: '08:45'
        round:
          type: integer
          minimum: 1
        gathering_group_name:
          type: string
        event_name:
          type: string
        gathering_spot_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateGatheringRequest:
      type: object
      required: [gatheringGroupId, eventId, gatheringSpotId]
      properties:
        gatheringGroupId:
          type: integer
          minimum: 1
        eventId:
          type: integer
          minimum: 1
        gatheringSpotId:
          type: integer
          minimum: 1
        gatheringTime:
          type: string
          pattern: '^(?:[01]\\d|2[0-3]):[0-5]\\d$|^99:59$'
          example: '08:45'
        round:
          type: integer
          minimum: 1
          maximum: 99

    RegisterFirebaseTokenRequest:
      type: object
      required: [studentNumber, platform]
      properties:
        studentNumber:
          type: string
          minLength: 1
        platform:
          type: integer
          enum: [1, 2]
          description: '`1`: iOS、`2`: Android'
        fcmToken:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
          deprecated: true
          description: '`fcmToken` の後方互換用の別名'
      anyOf:
        - required: [fcmToken]
        - required: [token]

    RegisterFirebaseTokenResponse:
      type: object
      required: [user, firebaseToken]
      properties:
        user:
          $ref: '#/components/schemas/NotificationTargetUser'
        firebaseToken:
          $ref: '#/components/schemas/FirebaseToken'

    NotificationTargetUser:
      type: object
      required: [user_id, user_name, is_live_active, created_at, updated_at]
      properties:
        user_id:
          type: integer
        user_name:
          type: string
        is_live_active:
          type: integer
          enum: [0, 1]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FirebaseToken:
      type: object
      required:
        [firebase_token_id, user_id, platform, fcm_token, is_firebase_active, last_seen_at, created_at, updated_at]
      properties:
        firebase_token_id:
          type: integer
        user_id:
          type: integer
        platform:
          type: integer
          enum: [1, 2]
        fcm_token:
          type: string
        is_firebase_active:
          type: integer
          enum: [0, 1]
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NotificationSchedule:
      type: object
      required:
        [notification_send_schedule_id, user_id, event_id, gathering_group_id, notification_id, importance, notification_type, title, body, send_status, send_at, created_at, updated_at]
      properties:
        notification_send_schedule_id:
          type: integer
        user_id:
          type: integer
          description: 通知予定を登録したユーザー
        event_id:
          type: integer
        gathering_group_id:
          type: integer
        notification_id:
          type: integer
        importance:
          type: integer
          enum: [2]
          default: 2
          description: MVPでは`2`固定
        notification_type:
          type: string
        title:
          type: string
        body:
          type: string
        send_status:
          type: string
          enum: [draft, sending, sent, failed]
        fcm_message_id:
          type: string
          nullable: true
        failed_reason:
          type: string
          nullable: true
        send_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateNotificationScheduleRequest:
      type: object
      required: [userId, eventId, gatheringGroupId, notificationId, sendAt]
      properties:
        userId:
          type: integer
          minimum: 1
        eventId:
          type: integer
          minimum: 1
        gatheringGroupId:
          type: integer
          minimum: 1
        notificationId:
          type: integer
          minimum: 1
        importance:
          type: integer
          enum: [2]
          default: 2
        sendAt:
          type: string
          format: date-time
          description: UTCオフセットを含むISO 8601形式
          example: '2026-07-16T09:00:00.000Z'

    NotificationScheduleListResponse:
      type: object
      required: [notification_schedules, total, limit, offset]
      properties:
        notification_schedules:
          type: array
          items:
            $ref: '#/components/schemas/NotificationSchedule'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Notification:
      type: object
      required: [notification_id, notification_type, title, body, created_at, updated_at]
      properties:
        notification_id:
          type: integer
        notification_type:
          type: string
          example: manual
        title:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateNotificationRequest:
      type: object
      required: [notificationType, title, body]
      properties:
        notificationType:
          type: string
          minLength: 1
          example: manual
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1

    UpdateNotificationRequest:
      type: object
      description: title または body のうち、少なくとも1項目を指定する
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1

    NotificationListResponse:
      type: object
      required: [notifications, total, limit, offset]
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    TestNotificationRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1

    FcmNotificationResult:
      type: object
      required: [success, messageId]
      properties:
        success:
          type: boolean
          enum: [true]
        messageId:
          type: string

    ScheduledNotificationResult:
      type: object
      required: [checkedEvents, sent, failed]
      properties:
        checkedEvents:
          type: integer
          description: 今回確保した通知予定数
        sent:
          type: integer
          description: 送信に成功した端末数
        failed:
          type: integer
          description: 送信に失敗した通知予定数

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: object
          additionalProperties: true

    AuthUser:
      type: object
      required: [id, email, display_name, avatar_url, avatar_updated_at]
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        avatar_updated_at:
          type: string
          nullable: true

    TokenExchangeRequest:
      type: object
      required: [code, state]
      properties:
        code:
          type: string
        state:
          type: string
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          description: mobileクライアントのみ必須。webはサーバー側で保存済みのものを使うため不要。

    TokenResponse:
      type: object
      required: [access_token, refresh_token_id, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token_id:
          type: string
          description: >-
            POST /auth/refresh で使うトークンID。使用の都度ローテーションされる。
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/AuthUser'

    AuthError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

tags:
  - name: Students
    description: 学生情報
  - name: Events
    description: イベント
  - name: ClassRooms
    description: クラス
  - name: Gathering spots
    description: 集合場所
  - name: Gathering groups
    description: 対象グループ
  - name: Gathering group members
    description: 対象グループの所属者
  - name: Gatherings
    description: 集合予定
  - name: Firebase tokens
    description: Firebaseトークン
  - name: Notification schedules
    description: 通知予定
  - name: Notifications
    description: Firebase通知
  - name: Auth
    description: 認証
