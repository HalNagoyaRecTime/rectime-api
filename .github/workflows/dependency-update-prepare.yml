name: 月次依存関係更新の準備

on:
  schedule:
    # 毎月1日 09:30 (JST)。major更新はこのworkflowでは扱わない。
    - cron: '30 0 1 * *'
  workflow_dispatch:

concurrency:
  group: monthly-dependency-update
  cancel-in-progress: false

jobs:
  policy:
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.policy.outputs.should_run }}

    steps:
      - name: 実行日を確認
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          if [ "$EVENT_NAME" = "schedule" ] && [ "$today" = "2026-12-01" ]; then
            echo "major更新日と重複するため、定期minor・patch更新をskipします。"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  cleanup-stale-candidates:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest

    steps:
      - name: 期限切れの候補branchを削除
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list \
            --state open \
            --limit 1000 \
            --json headRefName \
            --jq '.[].headRefName' > "$RUNNER_TEMP/open-pr-heads"
          cutoff=$(date -u -d '7 days ago' +%s)

          gh api --paginate \
            "repos/${GH_REPO}/git/matching-refs/heads/automation/monthly-dependencies-" \
            --jq '.[] | [.ref, .object.sha] | @tsv' |
          while IFS=$'\t' read -r ref sha; do
            branch=${ref#refs/heads/}
            if grep -Fqx "$branch" "$RUNNER_TEMP/open-pr-heads"; then
              continue
            fi

            email=$(gh api "repos/${GH_REPO}/commits/${sha}" --jq '.commit.author.email // ""')
            committed_at=$(gh api "repos/${GH_REPO}/commits/${sha}" --jq '.commit.committer.date')
            committed_epoch=$(date -u -d "$committed_at" +%s)
            if [ "$email" = "41898282+github-actions[bot]@users.noreply.github.com" ] && \
               [ "$committed_epoch" -lt "$cutoff" ]; then
              gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${branch}"
              echo "期限切れの候補branchを削除しました: ${branch}"
            fi
          done

  prepare:
    needs: policy
    if: needs.policy.outputs.should_run == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}

    steps:
      - name: developを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Node.jsを設定
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: 固定済み更新ツールをインストール
        run: npm ci --ignore-scripts

      - name: npm依存関係を互換範囲内で更新
        run: npm run dependencies:update:compatible

      - name: 依存関係のscriptを実行せずlock fileを再生成
        run: npm install --package-lock-only --ignore-scripts

      - name: 依存関係のscriptを実行せずlock fileを検証
        run: npm ci --ignore-scripts

      - name: GitHub Actionsを互換範囲内で更新
        run: npm run actions:update:compatible
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成した差分を検証
        id: patch
        env:
          BASE_REF: HEAD
          CANDIDATE_REF: WORKTREE
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "依存関係の更新はありません。"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node .github/scripts/verify-dependency-update.mjs
          mkdir -p .dependency-update
          git diff --binary --full-index > .dependency-update/update.patch
          git rev-parse HEAD > .dependency-update/base-sha
          branch="automation/monthly-dependencies-$(TZ=Asia/Tokyo date +%Y%m%d)-${GITHUB_RUN_ID}"
          printf '%s\n' "$branch" > .dependency-update/branch
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: 検証済みpatchを保存
        if: steps.patch.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-update-${{ github.run_id }}
          path: .dependency-update
          if-no-files-found: error
          retention-days: 1

  publish-candidate:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    permissions:
      actions: write
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest

    steps:
      - name: 最新のdevelopを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: 検証済みpatchを取得
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-update-${{ github.run_id }}
          path: .dependency-update

      - name: 未完了の依存関係更新PRを確認
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list \
            --base develop \
            --state open \
            --json headRefName \
            --jq '[.[] | select((.headRefName | startswith("automation/monthly-dependencies-")) or (.headRefName | startswith("dependabot/")))] | length')
          if [ "$count" -gt 0 ]; then
            echo "既存の自動依存関係更新PRがあるため、候補branchを作成しません。"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: patchを適用して再検証
        if: steps.existing.outputs.should_publish == 'true'
        env:
          BASE_REF: HEAD
          CANDIDATE_REF: WORKTREE
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected_base=$(cat .dependency-update/base-sha)
          current_base=$(git rev-parse HEAD)
          if [ "$expected_base" != "$current_base" ]; then
            echo "::error::prepare後にdevelopが更新されたため、安全のため中止します。"
            exit 1
          fi

          git apply --check .dependency-update/update.patch
          git apply .dependency-update/update.patch
          node .github/scripts/verify-dependency-update.mjs

      - name: 候補branchをpush
        if: steps.existing.outputs.should_publish == 'true'
        id: candidate
        run: |
          branch=$(cat .dependency-update/branch)
          if [[ ! "$branch" =~ ^automation/monthly-dependencies-[0-9]{8}-[0-9]+$ ]]; then
            echo "::error::候補branch名が不正です"
            exit 1
          fi

          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows
          git commit -m "chore(deps): 依存関係を定期更新"
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: 候補commitのCIを開始
        if: steps.existing.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: gh workflow run ci.yml --ref "$BRANCH"
