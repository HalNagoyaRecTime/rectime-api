openapi: 3.0.3
info:
  title: RecTime API
  description: |
    RecTime のバックエンドAPIです。
    イベントの書き込みAPIは、現時点では公開していません。
  version: 1.0.0

servers:
  - url: /api/v1
    description: APIのベースパス

paths:
  /admin/notifications:
    get:
      tags: [Notifications]
      summary: 管理画面向け通知一覧を通知単位で取得する
      description: Token単位の通知予定をnotification_id単位で集約して返します。
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: sendStatus
          in: query
          schema:
            type: string
            enum: [draft, sending, sent, failed]
        - name: eventId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 通知単位の集約一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotificationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Notifications]
      summary: 管理画面から手動通知を一括予約する
      description: |
        ログイン中のstaffまたはteacherが、配信対象を指定して手動通知を予約します。
        Backendが対象利用者の有効なFirebase Tokenを解決し、Token単位の通知予定を作成します。
        `userId` と `firebaseTokenId` はRequestで受け取りません。
        `scheduledAt`はJST基準で環境変数`EVENT_DATE`と同じ開催日だけを受け付けます。
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminNotificationRequest'
      responses:
        '201':
          description: 作成した手動通知と通知予定件数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotificationCreationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/notifications/{notificationId}:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Notifications]
      summary: 管理画面向け通知詳細を通知単位で取得する
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: 通知単位の集約詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotificationSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Notifications]
      summary: 未送信の管理画面向け通知を更新する
      description: |
        関連する通知予定がすべてdraftの場合のみ更新できます。
        配信対象を指定した場合は、有効なFirebase Tokenを再解決して通知予定を再作成します。
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminNotificationRequest'
      responses:
        '200':
          description: 更新した通知
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotificationSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Notifications]
      summary: 未送信の管理画面向け通知を物理削除する
      description: 関連する通知予定がすべてdraftの場合のみ、通知予定と通知本文を削除します。
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '204':
          description: 削除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /students:
    get:
      tags: [Students]
      summary: 学生一覧をページ単位で取得する
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 学生一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Students]
      summary: 学生を登録する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentWriteRequest'
      responses:
        '201':
          description: 登録した学生
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /students/{studentId}:
    get:
      tags: [Students]
      summary: 学生を取得する
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: 学生
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Students]
      summary: 学生を更新する
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentWriteRequest'
      responses:
        '200':
          description: 更新後の学生
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /staffs:
    get:
      tags: [Staffs]
      summary: 職員一覧を取得する
      responses:
        '200':
          description: 職員一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Staff'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /staffs/{staffId}:
    get:
      tags: [Staffs]
      summary: 職員を取得する
      parameters:
        - $ref: '#/components/parameters/StaffId'
      responses:
        '200':
          description: 職員
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /teachers:
    get:
      tags: [Teachers]
      summary: 教員一覧を検索する
      parameters:
        - name: teacherId
          in: query
          description: 教員IDで絞り込む
          schema:
            type: integer
            minimum: 1
        - name: userName
          in: query
          description: 氏名の部分一致で絞り込む
          schema:
            type: string
        - name: classRoomId
          in: query
          description: 担当クラスのIDで絞り込む
          schema:
            type: integer
            minimum: 1
        - name: isLiveActive
          in: query
          description: 有効状態で絞り込む
          schema:
            type: boolean
        - name: limit
          in: query
          description: 取得件数（デフォルト20、最大100）
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: 取得開始位置（0始まり、デフォルト0）
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: 教員一覧（ページ分け済み）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherPage'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Teachers]
      summary: 教員を新規登録する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherCreateRequest'
      responses:
        '201':
          description: 作成した教員
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /teachers/{teacherId}:
    get:
      tags: [Teachers]
      summary: 教員を取得する
      parameters:
        - $ref: '#/components/parameters/TeacherId'
      responses:
        '200':
          description: 教員
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Teachers]
      summary: 教員情報と担当クラスを更新する
      parameters:
        - $ref: '#/components/parameters/TeacherId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherUpdateRequest'
      responses:
        '200':
          description: 更新後の教員
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Teachers]
      summary: 教員を削除する（担当クラスに割り当てられている場合は削除できない）
      parameters:
        - $ref: '#/components/parameters/TeacherId'
      responses:
        '204':
          description: 削除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events:
    get:
      tags: [Events]
      summary: イベント一覧を取得する
      parameters:
        - name: start_time
          in: query
          description: JSTの開始時刻（HHMM形式）で完全一致検索する
          schema:
            type: string
            pattern: '^(?:[01]\d|2[0-3])[0-5]\d$'
            example: '0930'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: イベント一覧
          content:
            application/json:
              schema:
                type: object
                required: [events, total, limit, offset]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Events]
      summary: イベントを登録する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWriteRequest'
      responses:
        '201':
          description: 登録したイベント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{eventId}:
    get:
      tags: [Events]
      summary: イベントを取得する
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: イベント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Events]
      summary: イベントと自動通知設定を更新する
      description: |
        staffsまたはteachersとして登録されているログインユーザーのみ実行できます。
        競技基本情報と、開始15分前の自動通知予定を1つの処理で更新します。
        notification_enabledがfalseの場合は、未送信のevent_reminderのみ削除します。
        同じイベントが先に更新された場合は409 Conflictを返します。
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventWithNotificationRequest'
      responses:
        '200':
          description: 更新後のイベントと通知予定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventScheduleResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Events]
      summary: イベントと自動通知設定を部分更新する
      description: |
        staffsまたはteachersとして登録されているログインユーザーのみ実行できます。
        指定された競技情報だけを更新し、未指定の項目は変更しません。
        競技名、開始時刻、notification_enabledのいずれかを変更した場合は、
        未送信のevent_reminderを更新後の内容で再生成します。
        同じイベントが先に更新された場合は409 Conflictを返します。
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchEventWithNotificationRequest'
      responses:
        '200':
          description: 更新後のイベントと通知予定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventScheduleResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Events]
      summary: イベントを削除する
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '204':
          description: 削除完了
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{eventId}/gatherings:
    get:
      tags: [Events]
      summary: 競技の集合予定一覧を取得する
      description: 同じ競技に複数の集合予定がある場合は、集合ID順ですべて返します。
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: 集合予定一覧。未登録の場合は空配列
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gathering'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{eventId}/schedule:
    put:
      tags: [Events]
      summary: イベント時刻と通知予定を更新する
      deprecated: true
      description: |
        staffsまたはteachersとして登録されているログインユーザーのみ実行できます。
        通知ありの場合は、開催日の競技開始15分前に送信するdraft通知予定を作成または更新します。
        新規実装ではPUT /events/{eventId}を使用してください。
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventScheduleRequest'
      responses:
        '200':
          description: 更新したイベントと通知予定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventScheduleResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{eventId}/notification-summary:
    get:
      tags: [Events]
      summary: 競技単位の自動通知配信状況を取得する
      description: |
        staffsまたはteachersとして登録されているログインユーザーのみ実行できます。
        Token単位のevent_reminderを競技単位で集約し、手動通知は含めません。
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: 競技単位の自動通知配信状況
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventNotificationSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /classrooms:
    get:
      tags: [Classrooms]
      summary: クラス一覧を取得する
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: クラス一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Classrooms]
      summary: クラスを登録する
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassRequest' }
            example:
              classCode: IA14A
              className: 高度情報学科AI開発先行コース
              teacherId: null
      responses:
        '201':
          description: 登録したクラス
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassRoom' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /classrooms/{classId}:
    get:
      tags: [Classrooms]
      summary: クラス詳細を取得する
      parameters: [{ $ref: '#/components/parameters/ClassId' }]
      responses:
        '200':
          description: クラス詳細
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassRoom' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [Classrooms]
      summary: クラスを更新する
      parameters: [{ $ref: '#/components/parameters/ClassId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassRequest' }
            example:
              classCode: IA14A
              className: 高度情報学科AI開発先行コース
              teacherId: null
      responses:
        '200':
          description: 更新したクラス
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassRoom' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [Classrooms]
      summary: クラスを削除する
      parameters: [{ $ref: '#/components/parameters/ClassId' }]
      responses:
        '204': { description: 削除成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /gathering-spots:
    get:
      tags: [Gathering spots]
      summary: 集合場所一覧を取得する
      responses:
