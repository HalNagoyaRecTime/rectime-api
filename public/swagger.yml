      description: |
        Bearer Tokenから利用者を特定し、本人のFirebase Tokenに送信済みの通知だけを新しい順で返します。
        MVPでは未読・既読状態を管理しません。
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 本人宛ての通知一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileNotificationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me/notifications/{notificationId}:
    get:
