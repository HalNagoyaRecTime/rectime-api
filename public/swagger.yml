  /auth/microsoft/login:
    get:
      tags: [Auth]
      summary: Microsoftログイン認可URLを取得・リダイレクトする
      description: |
        Webクライアントの場合はMicrosoftの認可画面へ302リダイレクトします（PKCEはサーバー側で管理）。
        Mobileクライアントの場合は認可URLをJSONで返します（PKCEはクライアント側で管理し、
        `X-State` / `X-PKCE-Code-Challenge` ヘッダーの指定が必須）。
      parameters:
        - $ref: '#/components/parameters/ClientType'
        - name: X-State
          in: header
          description: Mobileクライアントのみ必須。PKCEのstate（Base64URL、デコード後32バイト以上）
          schema:
            type: string
        - name: X-PKCE-Code-Challenge
          in: header
          description: Mobileクライアントのみ必須。PKCEのcode_challenge（Base64URL）
          schema:
            type: string
      responses:
        '200':
          description: Mobileクライアント向けの認可URL
          content:
            application/json:
              schema:
                type: object
                required: [auth_url]
                properties:
                  auth_url:
                    type: string
        '302':
          description: Webクライアント向け、Microsoftの認可画面へのリダイレクト
        '400':
          $ref: '#/components/responses/AuthBadRequest'

  /auth/microsoft/callback:
    get:
      tags: [Auth]
      summary: Microsoftからの認可コールバックを処理する
      description: |
        Webクライアントの認可コードフロー専用エンドポイントです。Microsoftからのリダイレクトで
        呼び出され、認証成功時はセッションCookieを発行してフロントエンドへリダイレクトします。
        失敗時は `FRONTEND_URL/login?error=auth_failed` へリダイレクトします。
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '302':
          description: 認証成功時はフロントエンドへ、失敗時はログイン画面へリダイレクト
          headers:
            Set-Cookie:
              description: 認証成功時のみ、セッションCookie（`session`）を発行
              schema:
                type: string

  /auth/microsoft/token:
    post:
      tags: [Auth]
      summary: Mobileクライアントの認可コードをアクセストークンと交換する
      description: 'Mobileクライアント専用（`X-Client-Type: mobile` が必須）です。'
      parameters:
        - $ref: '#/components/parameters/ClientType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
      responses:
        '200':
          description: モバイル用アクセストークン・リフレッシュトークン
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: ログイン中のユーザー情報を取得する
      description: 'Webクライアントはセッション Cookie、Mobileクライアントは `Authorization: Bearer` で認証します。'
      parameters:
        - $ref: '#/components/parameters/ClientType'
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: ログイン中のユーザー情報
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /auth/me/photo:
    get:
      tags: [Auth]
      summary: ログイン中のユーザーのMicrosoftアカウント写真を取得する
      description: Microsoft Graph からユーザーの写真を取得して返却します。
      parameters:
        - $ref: '#/components/parameters/ClientType'
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: 写真データ
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '404':
          description: Microsoftアカウントに写真が登録されていない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: ログアウトする
      parameters:
        - $ref: '#/components/parameters/ClientType'
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: false
        description: Mobileクライアントの場合のみ、`refresh_token_id` を指定可能
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token_id:
                  type: string
      responses:
        '200':
          description: ログアウト成功
          headers:
            Set-Cookie:
              description: Webクライアントの場合、セッションCookieを削除
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/AuthBadRequest'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: セッション・トークンを更新する
      description: Webクライアントはセッション Cookie を、Mobileクライアントは `refresh_token_id` を用いて更新します。
      parameters:
        - $ref: '#/components/parameters/ClientType'
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: false
        description: Mobileクライアントの場合のみ必須
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token_id:
                  type: string
      responses:
        '200':
          description: 更新結果（Webはセッション更新のみ、Mobileは新しいトークンを返却）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RefreshWebResponse'
                  - $ref: '#/components/schemas/MobileTokenResponse'
          headers:
            Set-Cookie:
              description: Webクライアントの場合のみ、更新後のセッションCookieを発行
              schema:
                type: string
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

components:
  parameters:
    ClassId:
      name: classId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    TeacherId:
      name: teacherId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    GatheringId:
      name: gatheringId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    GatheringGroupId:
      name: gatheringGroupId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    GatheringSpotId:
      name: gatheringSpotId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ClientType:
      name: X-Client-Type
      in: header
      description: クライアント種別（省略時は `web` 扱い）
      schema:
        type: string
        enum: [web, mobile]

  responses:
    BadRequest:
      description: リクエストが不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 認証が必要
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 操作権限がない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 対象リソースが存在しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: リソースの現在状態では操作できない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: サーバーエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthBadRequest:
      description: リクエストが不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
    AuthUnauthorized:
      description: 認証が必要、またはセッション・トークンが無効
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Student:
      type: object
      required:
        [student_id, display_name, class_room_id, class_room_name, attendance_number, student_id_number, is_live_active]
      properties:
        student_id:
          type: integer
        display_name:
          type: string
        class_room_id:
          type: integer
        class_room_name:
          type: string
        attendance_number:
          type: integer
        student_id_number:
          type: string
        is_live_active:
          type: boolean

    StudentWriteRequest:
      type: object
      required: [display_name, class_room_id, attendance_number, student_id_number]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        class_room_id:
          type: integer
          minimum: 1
        attendance_number:
          type: integer
          minimum: 1
        student_id_number:
          type: string
          minLength: 1
          maxLength: 100

    StudentPage:
      type: object
      required: [students, total, limit, offset]
      properties:
        students:
          type: array
          items:
            $ref: '#/components/schemas/Student'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Staff:
      type: object
      required: [staff_id, user_id, display_name]
      properties:
        staff_id:
          type: integer
        user_id:
          type: integer
        display_name:
          type: string

    TeacherClassRoom:
      type: object
      required: [class_room_id, class_code, class_name]
      properties:
        class_room_id:
          type: integer
        class_code:
          type: string
        class_name:
          type: string

    Teacher:
      type: object
      required: [teacher_id, user_id, display_name, is_live_active, class_rooms]
      properties:
        teacher_id:
          type: integer
        user_id:
          type: integer
        display_name:
          type: string
        is_live_active:
          type: boolean
        class_rooms:
          type: array
          items:
            $ref: '#/components/schemas/TeacherClassRoom'

    TeacherUpdateRequest:
      type: object
      required: [userName, isLiveActive, classRoomIds]
      properties:
        userName:
          type: string
          minLength: 1
        isLiveActive:
          type: boolean
        classRoomIds:
          type: array
          uniqueItems: true
          description: 重複したIDを指定した場合は400を返す
          items:
            type: integer
            minimum: 1

    TeacherPage:
      type: object
      required: [items, total, page, limit, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Teacher'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        total_pages:
          type: integer

    Event:
      type: object
      required: [event_id, event_name, venue, start_time, end_time, created_at, updated_at]
      properties:
        event_id:
          type: integer
        event_name:
          type: string
        rule_text:
          type: string
          nullable: true
        venue:
          type: string
        start_time:
          type: string
          description: JSTの時刻（HHMM形式）
          example: '0930'
        end_time:
          type: string
          description: JSTの時刻（HHMM形式）
          example: '1745'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateEventScheduleRequest:
      type: object
      required: [startTime, endTime, notificationEnabled]
      properties:
        startTime:
          type: string
          description: JSTの開始時刻（HHMM形式）
          pattern: '^(?:[01]\d|2[0-3])[0-5]\d$'
          example: '1030'
        endTime:
          type: string
          description: JSTの終了時刻（HHMM形式）。開始時刻より後を指定します。
          pattern: '^(?:[01]\d|2[0-3])[0-5]\d$'
          example: '1100'
        notificationEnabled:
          type: boolean

    EventScheduleResult:
      type: object
      required: [event, notification_enabled, notification_schedules]
      properties:
        event:
          $ref: '#/components/schemas/Event'
        notification_enabled:
          type: boolean
        notification_schedules:
          type: array
          items:
            $ref: '#/components/schemas/NotificationSchedule'

    EventWriteRequest:
      type: object
      required: [event_name, venue, start_time, end_time]
      properties:
        event_name:
          type: string
        rule_text:
          type: string
          nullable: true
        venue:
          type: string
        start_time:
          type: string
          pattern: '^(?:[01]\d|2[0-3])[0-5]\d$'
        end_time:
          type: string
          pattern: '^(?:[01]\d|2[0-3])[0-5]\d$'

    ClassRoom:
      type: object
      required: [class_room_id, class_code, class_name, student_count, teacher]
      properties:
        class_room_id:
          type: integer
        class_code:
          type: string
        class_name:
          type: string
        student_count:
          type: integer
        teacher:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ClassTeacher'

    ClassTeacher:
      type: object
      required: [teacher_id, user_id, display_name]
      properties:
        teacher_id: { type: integer }
        user_id: { type: integer }
        display_name: { type: string }

    ClassRequest:
      type: object
      required: [classCode, className, teacherId]
      properties:
        classCode: { type: string, minLength: 1 }
        className: { type: string, minLength: 1 }
        teacherId:
          type: integer
          minimum: 1
          nullable: true

    ClassroomPage:
      type: object
      required: [classrooms, total, limit, offset]
      properties:
        classrooms:
          type: array
          items: { $ref: '#/components/schemas/ClassRoom' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    GatheringSpot:
      type: object
      required: [gathering_spot_id, gathering_spot_name, created_at, updated_at]
      properties:
        gathering_spot_id:
          type: integer
        gathering_spot_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateGatheringSpotRequest:
      type: object
      required: [gatheringSpotName]
      properties:
        gatheringSpotName:
          type: string
          minLength: 1

    UpdateGatheringSpotRequest:
      type: object
      required: [gatheringSpotName]
      properties:
        gatheringSpotName:
          type: string
          minLength: 1

    GatheringGroup:
      type: object
      required: [gathering_group_id, created_at, updated_at]
      properties:
        gathering_group_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GatheringGroupMember:
      type: object
      required: [gathering_group_member_id, gathering_group_id, user_id, created_at, updated_at]
      properties:
        gathering_group_member_id:
          type: integer
        gathering_group_id:
          type: integer
        user_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AddGatheringGroupMemberRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer
          minimum: 1

    Gathering:
      type: object
      required:
        [gathering_id, gathering_group_id, event_id, gathering_spot_id, gathering_time, round, created_at, updated_at, event_name, gathering_spot_name]
      properties:
        gathering_id:
          type: integer
        gathering_group_id:
          type: integer
        event_id:
          type: integer
        gathering_spot_id:
          type: integer
        gathering_time:
          type: string
          description: HH:MM形式。`99:59`は集合時刻が未設定であることを表します。
          example: '08:45'
        round:
          type: integer
          minimum: 1
        event_name:
          type: string
        gathering_spot_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateGatheringRequest:
      type: object
      required: [gatheringGroupId, eventId, gatheringSpotId]
      properties:
        gatheringGroupId:
          type: integer
          minimum: 1
        eventId:
          type: integer
          minimum: 1
        gatheringSpotId:
          type: integer
          minimum: 1
        gatheringTime:
          type: string
          pattern: '^(?:[01]\\d|2[0-3]):[0-5]\\d$|^99:59$'
          example: '08:45'
        round:
          type: integer
          minimum: 1
          maximum: 99

    RegisterFirebaseTokenRequest:
      type: object
      additionalProperties: false
      required: [fcmToken, platform]
      properties:
        platform:
          type: string
          enum: [android]
        fcmToken:
          type: string
          minLength: 1

    RegisterFirebaseTokenResponse:
      type: object
      required:
        [firebase_token_id, user_id, platform, is_firebase_active, last_seen_at]
      properties:
        firebase_token_id:
          type: integer
        user_id:
          type: integer
        platform:
          type: string
          enum: [android]
        is_firebase_active:
          type: boolean
        last_seen_at:
          type: string
          format: date-time

    FirebaseToken:
      type: object
      required:
        [firebase_token_id, user_id, platform, fcm_token, is_firebase_active, last_seen_at, created_at, updated_at]
      properties:
        firebase_token_id:
          type: integer
        user_id:
          type: integer
        platform:
          type: integer
          enum: [1, 2]
        fcm_token:
          type: string
        is_firebase_active:
          type: integer
          enum: [0, 1]
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NotificationSchedule:
      type: object
      required:
        [notification_schedule_id, notification_id, firebase_token_id, importance, notification_type, title, body, send_status, send_at, created_at, updated_at]
      properties:
        notification_schedule_id:
          type: integer
        created_user_id:
          type: integer
          nullable: true
          description: 通知予定を登録したユーザー
        event_id:
          type: integer
          nullable: true
        firebase_token_id:
          type: integer
        notification_id:
          type: integer
        importance:
          type: integer
          enum: [2]
          default: 2
          description: MVPでは`2`固定
        notification_type:
          type: string
        title:
          type: string
        body:
          type: string
        send_status:
          type: string
          enum: [draft, sending, sent, failed]
        fcm_message_id:
          type: string
          nullable: true
        failed_reason:
          type: string
          nullable: true
        send_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateNotificationScheduleRequest:
      type: object
      required: [notificationId, firebaseTokenId, sendAt]
      properties:
        eventId:
          type: integer
          minimum: 1
          nullable: true
        firebaseTokenId:
          type: integer
          minimum: 1
        notificationId:
          type: integer
          minimum: 1
        importance:
          type: integer
          enum: [2]
          default: 2
        sendAt:
          type: string
          format: date-time
          description: UTCオフセットを含むISO 8601形式
          example: '2026-07-16T09:00:00.000Z'

    NotificationScheduleListResponse:
      type: object
      required: [notification_schedules, total, limit, offset]
      properties:
        notification_schedules:
          type: array
          items:
            $ref: '#/components/schemas/NotificationSchedule'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    AdminNotificationAudience:
      oneOf:
        - type: object
          required: [type]
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [all]
        - type: object
          required: [type, classRoomId]
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [class_room]
            classRoomId:
              type: integer
              minimum: 1
        - type: object
          required: [type, gatheringGroupId]
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [gathering_group]
            gatheringGroupId:
              type: integer
              minimum: 1
        - type: object
          required: [type, eventId]
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [event_participants]
            eventId:
              type: integer
              minimum: 1
      discriminator:
        propertyName: type

    CreateAdminNotificationRequest:
      type: object
      required: [title, body, audience, scheduledAt]
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        audience:
          $ref: '#/components/schemas/AdminNotificationAudience'
        scheduledAt:
          type: string
          format: date-time
          description: UTCオフセットを含むISO 8601形式
          example: '2026-07-23T09:00:00+09:00'

    AdminNotificationCreationResult:
      type: object
      required:
        - notification_id
        - notification_type
        - title
        - body
        - audience
        - scheduled_at
        - schedule_count
        - send_status
        - importance
        - created_user_id
      properties:
        notification_id:
          type: integer
        notification_type:
          type: string
          enum: [manual]
        title:
          type: string
        body:
          type: string
        audience:
          type: object
          description: Requestの配信対象をsnake_caseへ変換した値
          additionalProperties: true
        scheduled_at:
          type: string
          format: date-time
        schedule_count:
          type: integer
          minimum: 1
        send_status:
          type: string
          enum: [draft]
        importance:
          type: integer
          enum: [2]
        created_user_id:
          type: integer

    Notification:
      type: object
      required: [notification_id, notification_type, title, body, created_at, updated_at]
      properties:
        notification_id:
          type: integer
        notification_type:
          type: string
          example: manual
        title:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MobileNotificationEvent:
      type: object
      required: [event_id, event_name, venue, start_time, end_time]
      properties:
        event_id:
          type: integer
        event_name:
          type: string
        venue:
          type: string
        start_time:
          type: string
          pattern: '^\d{4}$'
          example: '1030'
        end_time:
          type: string
          pattern: '^\d{4}$'
          example: '1100'

    MobileNotification:
      type: object
      required:
        [notification_id, notification_type, title, body, scheduled_at, related_event]
      properties:
        notification_id:
          type: integer
        notification_type:
          type: string
        title:
          type: string
        body:
          type: string
        scheduled_at:
          type: string
          format: date-time
          description: notification_schedules.send_atに記録された通知予定日時
        related_event:
          allOf:
            - $ref: '#/components/schemas/MobileNotificationEvent'
          nullable: true

    MobileNotificationListResponse:
      type: object
      required: [notifications, total, limit, offset]
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/MobileNotification'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    CreateNotificationRequest:
      type: object
      required: [notificationType, title, body]
      properties:
        notificationType:
          type: string
          minLength: 1
          example: manual
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1

    UpdateNotificationRequest:
      type: object
      description: title または body のうち、少なくとも1項目を指定する
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1

    NotificationListResponse:
      type: object
      required: [notifications, total, limit, offset]
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    TestNotificationRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1

    FcmNotificationResult:
      type: object
      required: [success, messageId]
      properties:
        success:
          type: boolean
          enum: [true]
        messageId:
          type: string

    ScheduledNotificationResult:
      type: object
      required: [checkedEvents, sent, failed]
      properties:
        checkedEvents:
          type: integer
          description: 今回確保した通知予定数
        sent:
          type: integer
          description: 送信に成功した端末数
        failed:
          type: integer
          description: 送信に失敗した通知予定数

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: object
          additionalProperties: true

    AuthUser:
      type: object
      required:
        [
          id,
          email,
          display_name,
          avatar_url,
          avatar_updated_at,
          is_student,
          is_staff,
          is_teacher,
        ]
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        avatar_updated_at:
          type: string
          nullable: true
        is_student:
          type: boolean
          description: students テーブルに紐づくアカウントかどうか
        is_staff:
          type: boolean
          description: staffs テーブルに紐づくアカウントかどうか（teachers と排他ではない）
        is_teacher:
          type: boolean
          description: teachers テーブルに紐づくアカウントかどうか（staffs と排他ではない）

    TokenExchangeRequest:
      type: object
      required: [code, state, code_verifier]
      properties:
        code:
          type: string
        state:
          type: string
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128

    MobileTokenResponse:
      type: object
      required: [access_token, refresh_token_id, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token_id:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/AuthUser'

    RefreshWebResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    AuthError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

