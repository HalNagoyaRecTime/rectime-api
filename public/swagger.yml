openapi: 3.0.3
info:
  title: RecTime API
  description: |
    RecTime のバックエンドAPIです。
    イベントの書き込みAPIは、現時点では公開していません。
  version: 1.0.0

servers:
  - url: /api/v1
    description: APIのベースパス

paths:
  /admin/notifications:
    post:
      tags: [Notifications]
      summary: 管理画面から手動通知を一括予約する
      description: |
        ログイン中のstaffまたはteacherが、配信対象を指定して手動通知を予約します。
        Backendが対象利用者の有効なFirebase Tokenを解決し、Token単位の通知予定を作成します。
        `userId` と `firebaseTokenId` はRequestで受け取りません。
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminNotificationRequest'
      responses:
        '201':
          description: 作成した手動通知と通知予定件数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotificationCreationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /students:
    get:
      tags: [Students]
      summary: 学生一覧をページ単位で取得する
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 学生一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Students]
      summary: 学生を登録する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentWriteRequest'
      responses:
        '201':
          description: 登録した学生
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /students/{studentId}:
    get:
      tags: [Students]
      summary: 学生を取得する
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: 学生
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /staffs:
    get:
      tags: [Staffs]
      summary: 職員一覧を取得する
      responses:
        '200':
          description: 職員一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Staff'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /staffs/{staffId}:
    get:
      tags: [Staffs]
      summary: 職員を取得する
      parameters:
        - $ref: '#/components/parameters/StaffId'
      responses:
        '200':
          description: 職員
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /teachers:
    get:
      tags: [Teachers]
      summary: 教員一覧を検索する
      parameters:
        - name: teacherId
          in: query
          description: 教員IDで絞り込む
          schema:
            type: integer
            minimum: 1
        - name: userName
          in: query
          description: 氏名の部分一致で絞り込む
          schema:
            type: string
        - name: classRoomId
          in: query
          description: 担当クラスのIDで絞り込む
          schema:
            type: integer
            minimum: 1
        - name: isLiveActive
          in: query
          description: 有効状態で絞り込む
          schema:
            type: boolean
        - name: page
          in: query
          description: ページ番号（1始まり、デフォルト1）
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: 1ページあたりの件数（デフォルト20）
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 教員一覧（ページ分け済み）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherPage'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /teachers/{teacherId}:
    get:
      tags: [Teachers]
      summary: 教員を取得する
      parameters:
        - $ref: '#/components/parameters/TeacherId'
      responses:
        '200':
          description: 教員
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Teachers]
      summary: 教員情報と担当クラスを更新する
      parameters:
        - $ref: '#/components/parameters/TeacherId'
    put:
      tags: [Students]
      summary: 学生を更新する
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherUpdateRequest'
      responses:
        '200':
          description: 更新後の教員
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Teachers]
      summary: 教員を削除する（担当クラスに割り当てられている場合は削除できない）
      parameters:
        - $ref: '#/components/parameters/TeacherId'
      responses:
        '204':
          description: 削除成功
              $ref: '#/components/schemas/StudentWriteRequest'
      responses:
        '200':
          description: 更新後の学生
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events:
    get:
      tags: [Events]
      summary: イベント一覧を取得する
      parameters:
        - name: start_time
          in: query
          description: JSTの開始時刻（HHMM形式）で完全一致検索する
          schema:
            type: string
            pattern: '^(?:[01]\d|2[0-3])[0-5]\d$'
            example: '0930'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: イベント一覧
          content:
            application/json:
              schema:
                type: object
                required: [events, total, limit, offset]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Events]
      summary: イベントを登録する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWriteRequest'
      responses:
        '201':
          description: 登録したイベント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{eventId}:
    get:
      tags: [Events]
      summary: イベントを取得する
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: イベント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Events]
      summary: イベントを更新する
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWriteRequest'
      responses:
        '200':
          description: 更新後のイベント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Events]
      summary: イベントを削除する
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '204':
          description: 削除完了
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{eventId}/schedule:
    put:
      tags: [Events]
      summary: イベント時刻と通知予定を更新する
      description: |
        staffsまたはteachersとして登録されているログインユーザーのみ実行できます。
        通知ありの場合は、開催日の競技開始15分前に送信するdraft通知予定を作成または更新します。
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventScheduleRequest'
      responses:
        '200':
          description: 更新したイベントと通知予定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventScheduleResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /classrooms:
    get:
      tags: [Classrooms]
      summary: クラス一覧を取得する
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: クラス一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Classrooms]
      summary: クラスを登録する
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassRequest' }
            example:
              classCode: IA14A
              className: 高度情報学科AI開発先行コース
              teacherId: null
      responses:
        '201':
          description: 登録したクラス
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassRoom' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /classrooms/{classId}:
    get:
      tags: [Classrooms]
      summary: クラス詳細を取得する
      parameters: [ { $ref: '#/components/parameters/ClassId' } ]
      responses:
        '200':
          description: クラス詳細
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassRoom' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [Classrooms]
      summary: クラスを更新する
      parameters: [ { $ref: '#/components/parameters/ClassId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassRequest' }
            example:
              classCode: IA14A
              className: 高度情報学科AI開発先行コース
              teacherId: null
      responses:
        '200':
          description: 更新したクラス
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassRoom' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [Classrooms]
      summary: クラスを削除する
      parameters: [ { $ref: '#/components/parameters/ClassId' } ]
      responses:
        '204': { description: 削除成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /gathering-spots:
    get:
      tags: [Gathering spots]
      summary: 集合場所一覧を取得する
      responses:
        '200':
          description: 集合場所一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GatheringSpot'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Gathering spots]
      summary: 集合場所を作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGatheringSpotRequest'
      responses:
        '201':
          description: 作成した集合場所
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatheringSpot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gathering-spots/{gatheringSpotId}:
    put:
      tags: [Gathering spots]
      summary: 集合場所を更新する
      parameters:
        - $ref: '#/components/parameters/GatheringSpotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGatheringSpotRequest'
      responses:
        '200':
          description: 更新した集合場所
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatheringSpot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gathering-groups:
    get:
      tags: [Gathering groups]
      summary: 対象グループ一覧を取得する
      responses:
        '200':
          description: 対象グループ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GatheringGroup'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Gathering groups]
      summary: 対象グループを作成する
      responses:
        '201':
          description: 作成した対象グループ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatheringGroup'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gathering-groups/{gatheringGroupId}:
    delete:
      tags: [Gathering groups]
      summary: 集合グループを削除する
      description: 所属メンバーも削除します。集合予定に割り当てられている場合は削除できません。
      parameters:
        - $ref: '#/components/parameters/GatheringGroupId'
      responses:
        '204':
          description: 削除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gathering-groups/{gatheringGroupId}/members:
    get:
      tags: [Gathering group members]
      summary: 対象グループの所属者一覧を取得する
      parameters:
        - $ref: '#/components/parameters/GatheringGroupId'
      responses:
        '200':
          description: 所属者一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GatheringGroupMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Gathering group members]
      summary: 対象グループへ所属者を追加する
      parameters:
        - $ref: '#/components/parameters/GatheringGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGatheringGroupMemberRequest'
      responses:
        '201':
          description: 追加した所属情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatheringGroupMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: すでに対象グループへ所属している
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gathering-groups/{gatheringGroupId}/members/{userId}:
    delete:
      tags: [Gathering group members]
      summary: 対象グループから所属者を削除する
      parameters:
        - $ref: '#/components/parameters/GatheringGroupId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: 削除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gatherings:
    get:
      tags: [Gatherings]
      summary: 集合予定一覧を取得する
      responses:
        '200':
          description: 集合予定一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gathering'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Gatherings]
      summary: 集合予定を作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGatheringRequest'
      responses:
        '201':
          description: 作成した集合予定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gathering'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 対象グループにはすでに集合予定が登録されている
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gatherings/{gatheringId}:
    delete:
      tags: [Gatherings]
      summary: 集合予定を削除する
      description: 参加者グループと所属メンバーは保持します。
      parameters:
        - $ref: '#/components/parameters/GatheringId'
      responses:
        '204':
          description: 削除成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /firebase-tokens:
    post:
      tags: [Firebase tokens]
      summary: Firebaseトークンを登録または更新する
      description: |
        Mobile Bearer Tokenからログイン中の利用者を特定し、AndroidのFirebase Registration Tokenを登録または更新します。
        userIdや学籍番号をリクエストで指定することはできません。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterFirebaseTokenRequest'
      responses:
        '200':
          description: 登録または更新したFirebaseトークン
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterFirebaseTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Firebaseトークンが別の利用者に登録済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notification-schedules:
    get:
      tags: [Notification schedules]
      summary: 通知予定一覧を取得する
      parameters:
        - name: sendStatus
          in: query
          schema:
            type: string
            enum: [draft, sending, sent, failed]
        - name: eventId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: createdUserId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: firebaseTokenId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 通知予定一覧
          content:
            application/json:
              schema:
