name: Deploy to Cloudflare Workers

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# concurrency.group と jobs.deploy.environment はproduction/staging判定の式を共有している。
# どちらもジョブのステップが実行される前に評価されるフィールドのため、
# ステップのoutputsを介して1箇所に共通化することができない(needsで依存する別jobに
# 判定を切り出せば可能だが、そこまでの構成変更はしていない)。production/stagingの
# 判定式を変更する場合は、jobs.deploy.environment の同じ式も必ず合わせて変更すること。
#
# ただしPRプレビュー(pull_request)は、developmentと同じグループにしていない:
# 同じグループにすると全PRが1つのグループに集約され、cancel-in-progress: true により
# 無関係な別PRのCI完了で自分のPRのpreviewデプロイが途中キャンセルされてしまう
# (developへの通常デプロイも同様に別PRから止められ得る)。PRごとに一意なグループに
# 分離し、同一PRへの連続pushだけが直列化されるようにする。
#
# fork由来のPRではセキュリティ上の理由からworkflow_run.pull_requestsが空になり、
# pull_requests[0].numberがnullになる。この場合は全fork PRがgroup名"pr-"に
# 集約されてしまうため、フォールバックとしてworkflow_run.id(実行ごとに一意)を使う。
# fork PRの連続pushはこのフォールバックにより直列化されない(実行ごとに別グループになる)が、
# "Set deploy target"のPR_NUMBER空チェックでいずれのpushも即座に失敗するため実害は小さい。
#
# concurrency.groupへの参加とcancel-in-progressの発火は、ワークフロー実行がキューされた
# 時点(=jobs.deploy.ifが評価される前)で起こる。そのため、workflow_dispatchがmain以外の
# ブランチから実行された場合にgroup式のどの条件にも一致しないと、最終フォールバックの
# 'development'に落ちてしまい、jobがskipされる前に進行中のdevelopデプロイを巻き添え
# キャンセルしてしまう。これを防ぐため、workflow_dispatch(main以外)専用のユニークな
# group('invalid-dispatch-<ブランチ名>')に分離し、他のgroupと絶対に衝突しないようにする。
#
# cancel-in-progressは、PRプレビュー(使い捨てのビルド)のみtrueにする。production/staging/
# developmentは共有リソースへの`d1 migrations apply --remote`を含むため、途中キャンセルで
# D1の状態が中途半端になり得る連続デプロイは、キャンセルさせず直列に実行させたい。
concurrency:
  group: deploy-cloudflare-workers-${{ github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' && 'production' || format('invalid-dispatch-{0}', github.ref_name)) || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') && 'staging' || (github.event.workflow_run.event == 'pull_request') && format('pr-{0}', github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id) || 'development' }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # workflow_dispatchがmain以外のブランチから実行された場合、ここでジョブ自体を
    # skipする(以前は"Set deploy target"ステップのシェル側ガードのみで、そこに至る
    # 前にconcurrency.groupの'development'フォールバックに入って進行中のdevelop
    # デプロイを巻き添えキャンセルしてしまっていた。concurrency.group側の対応は上部参照)。
    # シェル側のガードは冗長化として残す。
    #
    # pull_requestはさらに、PRがfork由来でないことも検証する。fork PRはhead_repository
    # がこのリポジトリと一致しないため、ここでskipすることでcheckout/npm ci自体が
    # 実行されなくなり、fork側コードのpostinstallなどが(pull-requests: writeを含む)
    # GITHUB_TOKENへアクセスできる状態でCIランナー上で動くことを防ぐ
    # (fork PRは従来から"Set deploy target"のPR_NUMBER空チェックで結局失敗していたため、
    # ここでのskipによる機能低下はない)。
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        (github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.head_repository.full_name == github.repository)))
    name: Deploy (${{ github.event.workflow_run.head_branch || github.ref_name }})
    runs-on: ubuntu-latest
    # concurrency.groupのproduction/staging判定と同じ式(上部のコメント参照)。
    # PRプレビューもdevelopmentと同じGitHub Environment(同じsecrets/vars)を使うため、
    # concurrency.groupのようなPRごとの分離はここでは不要。
    # production/stagingの判定式を変更する場合は両方揃えること。
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') && 'production' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') && 'staging' || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set deploy target
        id: target
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          EVENT: ${{ github.event.workflow_run.event || 'workflow_dispatch' }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # 本番デプロイは手動実行(workflow_dispatch)のみで行うが、
            # 誤って main 以外のブランチから実行され本番に反映されることを防ぐため、
            # ブランチも合わせて検証する。
            if [ "$BRANCH" != "main" ]; then
              echo "::error::本番デプロイはmainブランチからのworkflow_dispatchのみ許可されています(現在のブランチ: $BRANCH)"
              exit 1
            fi
            echo "mode=deploy" >> "$GITHUB_OUTPUT"
            echo "env_flag=" >> "$GITHUB_OUTPUT"
            echo "d1_database=rectime-api" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::workflow_runイベントからPR番号を取得できませんでした(フォークからのPRの可能性があります)"
              exit 1
            fi
            # PRごとに独立したpreview URL(pr-<番号>-rectime-api-development.<subdomain>.workers.dev)を発行する。
            # D1/KVはenv.developmentと共用(バージョンごとに分離できないため)。
            echo "mode=pr-preview" >> "$GITHUB_OUTPUT"
            echo "env_flag=--env development" >> "$GITHUB_OUTPUT"
            echo "d1_database=rectime-api-dev" >> "$GITHUB_OUTPUT"
            echo "preview_alias=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "main" ]; then
            # mainへのpushはstagingへ自動デプロイする(本番はworkflow_dispatchのみ)。
            echo "mode=deploy" >> "$GITHUB_OUTPUT"
            echo "env_flag=--env staging" >> "$GITHUB_OUTPUT"
            echo "d1_database=rectime-api-staging" >> "$GITHUB_OUTPUT"
          else
            echo "mode=deploy" >> "$GITHUB_OUTPUT"
            echo "env_flag=--env development" >> "$GITHUB_OUTPUT"
            echo "d1_database=rectime-api-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ${{ steps.target.outputs.d1_database }} --remote ${{ steps.target.outputs.env_flag }}

      - name: Deploy to Cloudflare Workers
        if: steps.target.outputs.mode == 'deploy'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify ${{ steps.target.outputs.env_flag }}

      - name: Upload PR preview version
        if: steps.target.outputs.mode == 'pr-preview'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            versions upload --minify --env development
            --preview-alias ${{ steps.target.outputs.preview_alias }}
            --message "PR #${{ steps.target.outputs.pr_number }}"

      - name: Comment preview URL on PR
        if: steps.target.outputs.mode == 'pr-preview'
        uses: actions/github-script@v7
        env:
          PREVIEW_ALIAS: ${{ steps.target.outputs.preview_alias }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        with:
          script: |
            const alias = process.env.PREVIEW_ALIAS;
            const url = `https://${alias}-rectime-api-development.rectime-project.workers.dev`;
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = "<!-- rectime-api-preview-url -->";
            const body = [
              marker,
              `🚀 Preview: ${url}`,
              "",
              "(Microsoft OAuthログインは、このURLがMicrosoft Entra側に事前登録されていない場合失敗します。API自体の動作確認には利用できます)",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
