name: Deploy to Cloudflare Workers

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-workers-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request'))
    name: Deploy (${{ github.event.workflow_run.head_branch || github.ref_name }})
    runs-on: ubuntu-latest
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'preview' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set deploy target
        id: target
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          EVENT="${{ github.event.workflow_run.event || 'workflow_dispatch' }}"
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"

          if [ "$EVENT" = "pull_request" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::workflow_runイベントからPR番号を取得できませんでした(フォークからのPRの可能性があります)"
              exit 1
            fi
            # PRごとに独立したpreview URL(pr-<番号>-rectime-api-preview.<subdomain>.workers.dev)を発行する。
            # D1/KVはenv.previewと共用(バージョンごとに分離できないため)。
            echo "mode=pr-preview" >> "$GITHUB_OUTPUT"
            echo "env_flag=--env preview" >> "$GITHUB_OUTPUT"
            echo "d1_database=rectime-api-dev" >> "$GITHUB_OUTPUT"
            echo "preview_alias=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "main" ]; then
            echo "mode=deploy" >> "$GITHUB_OUTPUT"
            echo "env_flag=" >> "$GITHUB_OUTPUT"
            echo "d1_database=rectime-api" >> "$GITHUB_OUTPUT"
          else
            echo "mode=deploy" >> "$GITHUB_OUTPUT"
            echo "env_flag=--env preview" >> "$GITHUB_OUTPUT"
            echo "d1_database=rectime-api-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ${{ steps.target.outputs.d1_database }} --remote ${{ steps.target.outputs.env_flag }}

      - name: Deploy to Cloudflare Workers
        if: steps.target.outputs.mode == 'deploy'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify ${{ steps.target.outputs.env_flag }}

      - name: Upload PR preview version
        if: steps.target.outputs.mode == 'pr-preview'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            versions upload --minify --env preview
            --preview-alias ${{ steps.target.outputs.preview_alias }}
            --message "PR #${{ steps.target.outputs.pr_number }}"

      - name: Comment preview URL on PR
        if: steps.target.outputs.mode == 'pr-preview'
        uses: actions/github-script@v7
        with:
          script: |
            const alias = "${{ steps.target.outputs.preview_alias }}";
            const url = `https://${alias}-rectime-api-preview.rectime-project.workers.dev`;
            const prNumber = Number("${{ steps.target.outputs.pr_number }}");
            const marker = "<!-- rectime-api-preview-url -->";
            const body = [
              marker,
              `🚀 Preview: ${url}`,
              "",
              "(Microsoft OAuthログインは、このURLがMicrosoft Entra側に事前登録されていない場合失敗します。API自体の動作確認には利用できます)",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
