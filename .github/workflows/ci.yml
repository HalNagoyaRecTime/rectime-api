name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: TypeScript type check
        run: npm run type-check

      - name: GitHub ActionsのSHA固定を確認
        run: npm run actions:check

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  wrangler-dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wrangler bundleをdry runで検証
        run: npm exec -- wrangler deploy --dry-run --env development --outdir .wrangler/dependency-validation

  action-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref_name, 'automation/monthly-dependencies-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: GitHub Scriptをsmoke test
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: core.info('GitHub Scriptの起動を確認しました。')

      - name: Wrangler Actionをsmoke test
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          command: --version
          packageManager: npm

  artifact-upload-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref_name, 'automation/monthly-dependencies-')
    runs-on: ubuntu-latest

    steps:
      - name: smoke test用artifactを作成
        run: printf '%s\n' 'dependency-action-smoke' > "$RUNNER_TEMP/artifact-smoke.txt"

      - name: artifactを保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/artifact-smoke.txt
          if-no-files-found: error
          retention-days: 1

  artifact-download-smoke:
    needs: artifact-upload-smoke
    runs-on: ubuntu-latest

    steps:
      - name: artifactを取得
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/dependency-action-smoke

      - name: artifactの内容を確認
        run: test "$(cat "$RUNNER_TEMP/dependency-action-smoke/artifact-smoke.txt")" = 'dependency-action-smoke'
