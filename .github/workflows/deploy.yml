name: Deploy to Cloudflare Workers

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # PRではデプロイしない。未マージのmigrationが共有D1に入ると、PR内で改名・修正したときに
    # d1_migrationsと実際のスキーマが食い違い、以降のmigrateがすべて失敗するため(#462)。
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'develop')
    strategy:
      # 片方の環境が失敗しても、もう片方のD1 migrationを途中でキャンセルさせないため
      fail-fast: false
      matrix:
        # environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["production"]' || '["development","staging"]') }}
        include: ${{ fromJSON(
          github.event_name == 'workflow_dispatch' &&
          '[{"environment":"production","region":"nagoya","config":"wrangler-nagoya.jsonc"},
          {"environment":"production","region":"tokyo","config":"wrangler-tokyo.jsonc"},
          {"environment":"production","region":"osaka","config":"wrangler-osaka.jsonc"}]' ||
          '[{"environment":"staging","region":"nagoya","config":"wrangler-nagoya.jsonc"},
          {"environment":"staging","region":"tokyo","config":"wrangler-tokyo.jsonc"},
          {"environment":"staging","region":"osaka","config":"wrangler-osaka.jsonc"}]'
          ) }} 

    # cancel-in-progressにしないのは、migration中にキャンセルされるとD1が中途半端な状態になるため。
    # queueをmaxにしないと、待機中の実行が後続に置き換えられて永久にデプロイされなくなる。
    concurrency:
      group: deploy-cloudflare-workers-${{ matrix.environment }}-${{ matrix.region }}
      cancel-in-progress: false
      queue: max
    name: Deploy (${{ matrix.environment }})-${{ matrix.region }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    env:
      WRANGLER_ENV_FLAG: ${{ matrix.environment != 'production' && format('--env {0}', matrix.environment) || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 通知Secretの登録を確認
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run notifications:check -- ${{ needs.target.outputs.env_flag }}

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote --config ${{ matrix.config }} ${{ env.WRANGLER_ENV_FLAG }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify --config ${{ matrix.config }} ${{ env.WRANGLER_ENV_FLAG }}
